name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Protocol self-checks
        run: |
          python3 tools/mirror_check.py
          swift run PeatsKitChecks
      - name: Build universal app
        run: scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent PeatsMac.app PeatsMac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PeatsMac-app
          path: build/PeatsMac.zip
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$COMMIT_MSG" == *"[re-release]"* ]]; then
              echo "Replacing existing release $TAG."
              gh release delete "$TAG" --cleanup-tag --yes
            else
              echo "Release $TAG already exists, skipping."
              exit 0
            fi
          fi
          gh release create "$TAG" build/PeatsMac.zip \
            --target "$GITHUB_SHA" \
            --title "PeatsMac $TAG" \
            --notes-file RELEASE_NOTES.md \
            --latest
