name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Protocol self-checks
        run: |
          python3 tools/mirror_check.py
          swift run PeatsKitChecks
      - name: Build universal app
        run: scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent PeatsMac.app PeatsMac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PeatsMac-app
          path: build/PeatsMac.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" build/PeatsMac.zip \
            --title "PeatsMac ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
